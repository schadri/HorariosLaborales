<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="violetGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764"/>
      <stop offset="50%" stop-color="#6b21a8"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3e8ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background with rounded squircles -->
  <rect width="512" height="512" rx="128" fill="url(#violetGrad)"/>
  
  <!-- Subtle inner border -->
  <rect x="8" y="8" width="496" height="496" rx="120" fill="none" stroke="#c084fc" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Floating white card in the center (matching the webapp) -->
  <rect x="96" y="96" width="320" height="320" rx="72" fill="url(#cardGrad)" filter="url(#shadow)"/>

  <!-- Outer Clock Ring -->
  <circle cx="256" cy="240" r="80" fill="none" stroke="#7e22ce" stroke-width="14" stroke-linecap="round"/>
  
  <!-- Center Pin -->
  <circle cx="256" cy="240" r="10" fill="#581c87"/>

  <!-- Clock Hands pointing to 7:00 or 10:30 -->
  <!-- Hour hand -->
  <line x1="256" y1="240" x2="216" y2="280" stroke="#581c87" stroke-width="14" stroke-linecap="round"/>
  <!-- Minute hand -->
  <line x1="256" y1="240" x2="256" y2="180" stroke="#7e22ce" stroke-width="12" stroke-linecap="round"/>

  <!-- Small sparkles/calendar dots -->
  <circle cx="206" cy="356" r="8" fill="#9333ea"/>
  <circle cx="256" cy="356" r="8" fill="#7e22ce"/>
  <circle cx="306" cy="356" r="8" fill="#9333ea"/>
</svg>